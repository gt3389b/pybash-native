[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pybash-native"
version = "0.2.0"
description = "A native Python implementation of a Bash-like shell"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["jinja2>=3.1"]
authors = [{ name = "pybash" }]

[project.scripts]
pybash = "pybash.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pybash = ["templates/*.tmpl"]

[tool.pytest.ini_options]
addopts = "-q --cov=pybash --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src/pybash"]

[tool.coverage.report]
skip_empty = true
show_missing = true
